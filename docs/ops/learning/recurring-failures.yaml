      "title": "Requested AI chat sources disappear across routing projections",
      "status": "active",
      "maturity": "detectable",
      "canonical_owner": "Chat-turn research contract and per-source Research receipts",
      "symptoms": [
        "The assistant says it could not search a source the user explicitly requested even though a direct reader exists.",
        "The retrieval plan names meetings, email, or Teams but the live tool set omits the corresponding reader.",
        "A specialist provider or credit failure is reported as if the underlying source were unavailable.",
        "The answer claims complete mixed-source research without a receipt for every requested source.",
        "A required multi-stage reader repeatedly times out at a universal external-source ceiling even though the same reader completes when retried."
        ,"FMDS vector chunks, tables, and figures report different revision identities during one research turn."
      ],
      "affected_paths": [
        "frontend/src/lib/ai/retrieval/**",
        "frontend/src/lib/ai/orchestrator.ts",
        "frontend/src/lib/ai/fmds-tool-policy.ts",
        "frontend/src/app/api/ai-assistant/chat/handler-v2.ts"
      ],
      "root_cause": "Requested-source policy, including execution budgets and corpus revision selection, was independently reconstructed in planning, prefetch, tool composition, FMDS filtering, prompt instructions, trace, and citations. A universal 3000 ms external timeout ignored the meeting reader's embedding, dual-search, and metadata stages and abandoned valid results. The first source-specific correction remained shallow because broadening one source into three queries did not scale its aggregate budget with the declared workload. FMDS structured evidence independently selected latest revisions instead of consuming the vector search's selected revision.",
      "detection_gap": "Focused tests proved individual modules and failure-loud behavior but did not require every essential source to complete on the exact live prompt, assert source-specific execution budgets, or assert that aggregate budget scales when the contract expands one source into multiple searches.",
      "first_checks": [
        {
          "command": "cd frontend && pnpm exec jest --runInBand --runTestsByPath src/lib/ai/retrieval/__tests__/research-contract.test.ts src/lib/ai/__tests__/mixed-source-research-seam.test.ts",
          "expected": "One typed contract projects the exact requested source readers and produces a terminal receipt for every required source."
        },
        {
          "command": "rg -n \"FMDS_COMMUNICATION_TOOL_NAMES|includeMicrosoftSourceReadTools|detectCommunicationResearchSources\" frontend/src/lib/ai frontend/src/app/api/ai-assistant/chat",
          "expected": "No matches; source/tool mappings have one owner."
        }
      ],
      "prevention": "Compile requested research once; keep reader identity, bounded per-query execution budget, workload-derived aggregate timeout, corpus revision identity, tool visibility, prompt obligations, and receipt projections in the same registry; pass the selected revision explicitly to every structured-evidence adapter; persist terminal per-source receipts; suppress redundant live readers after successful prefetch; reject both complete-coverage and task-completion claims while an essential requested reader is non-successful.",
      "guardrail": {
        "kind": "interface_contract_test",
        "status": "active",
        "command": "cd frontend && pnpm exec jest --runInBand --runTestsByPath src/lib/ai/retrieval/__tests__/research-contract.test.ts src/lib/ai/__tests__/mixed-source-research-seam.test.ts",
        "evidence": "docs/ops/evidence/2026-07-22-aai-1248-chat-turn-research-contract/verification.md"
      },
      "incidents": [
        {
          "date": "2026-07-22",
          "task": "AAI-1244",
          "summary": "A mixed Alleato process plus FMDS request planned communication research, but downstream tool composition exposed only FMDS evidence; an interim specialist path then failed on provider credit."
        },
        {
          "date": "2026-07-22",
          "task": "AAI-1248",
          "summary": "The distributed exception was replaced with one Chat-turn research contract and receipt guardrail; reopening proved failure-loud behavior was insufficient until query-count-scaled budgets completed the primary meetings receipt."
        }
