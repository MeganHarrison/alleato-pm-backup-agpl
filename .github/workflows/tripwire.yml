name: Schema Tripwire

# Snapshots the production databases, diffs against the last snapshot, and
# commits the result under audit/. A destructive change (dropped table/column,
# cratered row count) fails the job — which emails the repo owner — and opens
# an issue. The committed snapshot files are the append-only, tamper-evident trail.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   PM_DATABASE_URL   — read connection string for the production PM APP database
#   RAG_DATABASE_URL  — read connection string for the production RAG database
# Use a READ-ONLY database role for these (see audit/README.md).

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily
    - cron: "0 18 * * *"  # 18:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: tripwire
  cancel-in-progress: false

jobs:
  tripwire:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install --no-audit --no-fund

      - name: Run tripwire
        id: run
        continue-on-error: true
        env:
          PM_DATABASE_URL: ${{ secrets.PM_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
        run: node scripts/run-tripwire.mjs

      - name: Commit snapshots + reports
        working-directory: .
        run: |
          git config user.name "tripwire-bot"
          git config user.email "tripwire@users.noreply.github.com"
          git add audit/snapshots audit/reports
          if git diff --cached --quiet; then
            echo "No new snapshot files to commit."
          else
            git commit -m "tripwire: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Open issue on destructive drift
        if: steps.run.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🔴 Destructive schema drift detected ${new Date().toISOString().slice(0,10)}`;
            const body = [
              'The schema tripwire found a **critical or high** structural change in production.',
              '',
              'See the failed run for the full drift report:',
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'The `audit/reports/` and `audit/snapshots/` folders in the latest commit hold the exact before/after.',
              'This is timestamped, tamper-evident evidence of *what* changed and *when*.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, body, labels: ['drift','critical'],
            });

      - name: Fail if drift
        if: steps.run.outcome == 'failure'
        run: |
          echo "Destructive drift detected — see the issue and audit/reports/."
          exit 1
