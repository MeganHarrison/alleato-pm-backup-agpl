name: Acumatica Direct-Cost Reconciliation

# Catches budget-JTD drift automatically: fails if any non-deleted Acumatica
# direct_cost header stops reconciling to sum(direct_cost_line_items.line_total)
# — the net-vs-gross retainage class (see PR #878 / #884). Runs twice daily,
# ~90 min after the Acumatica financial sync (schedule 0 0,12 * * * UTC) so it
# validates the freshly-synced data. Also runnable on demand.

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1,13 * * *"

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate DATABASE_URL secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [[ -z "${DATABASE_URL}" ]]; then
            echo "Missing required secret: DATABASE_URL"
            exit 1
          fi

      - name: Install pg driver
        # Only the pg driver is needed at runtime (env comes from secrets, so
        # dotenv/supabase-js are not required). Install it standalone without
        # touching the committed lockfiles / pnpm workspace.
        run: npm install pg --no-save --no-package-lock

      - name: Verify direct-cost reconciliation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/verify/verify-direct-cost-reconciliation.mjs
