name: Docs Freshness Weekday

on:
  schedule:
    - cron: "30 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-freshness-weekday
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      RAG_SUPABASE_URL: ${{ vars.RAG_SUPABASE_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      EVE_DOCS_MAINTAINER_LINEAR_ISSUE_ID: ${{ vars.EVE_DOCS_MAINTAINER_LINEAR_ISSUE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Validate delivery configuration
        shell: bash
        run: |
          required=(
            NEXT_PUBLIC_SUPABASE_URL
            RAG_SUPABASE_URL
            SUPABASE_ACCESS_TOKEN
            LINEAR_API_KEY
            EVE_DOCS_MAINTAINER_LINEAR_ISSUE_ID
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Docs freshness weekday scan blocked: missing ${name}."
              exit 1
            fi
          done

      - name: Install locked dependencies
        run: npm ci

      - name: Scan docs and verify Linear delivery
        run: npm --workspace docs-freshness-maintainer run weekday:scan
