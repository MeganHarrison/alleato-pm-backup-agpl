name: Claude Code Action

# On-demand Claude: responds to explicit @claude mentions on issues, PRs, and
# review threads. Automated issue fixing lives in autofix-issue.yml and the
# automated review/merge loop lives in autofix-pr-manager.yml — this workflow
# intentionally does NOT fire on every new issue or every PR comment.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [assigned]

concurrency:
  group: claude-mention-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.action == 'assigned' && contains(github.event.issue.assignees.*.login, 'anthropic-claude-code'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure git author
        run: |
          git config user.name "MeganHarrison"
          git config user.email "109628141+MeganHarrison@users.noreply.github.com"

      - name: Claude Code Action Official
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      # The action exits 0 even when the run errored (is_error) — the truth is
      # the final "result" entry in its execution_file. Fail loudly instead of a
      # silent green check. Common cause: invalid/expired/malformed
      # CLAUDE_CODE_OAUTH_TOKEN (stray whitespace) or an account usage limit.
      - name: Assert Claude run succeeded
        if: ${{ always() }}
        shell: bash
        env:
          STEP_OUTCOME: ${{ steps.claude.outcome }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          LABEL: "Claude mention"
        run: |
          if [ "$STEP_OUTCOME" = "skipped" ]; then echo "$LABEL skipped — nothing to assert."; exit 0; fi
          if [ -z "$EXEC_FILE" ] || [ ! -f "$EXEC_FILE" ]; then
            echo "::error::$LABEL produced no execution_file — the action did not run to completion (likely a credential/setup failure)."
            exit 1
          fi
          is_error=$(jq -r '[.[] | select(.type == "result")] | last | .is_error | if . == null then true else . end' "$EXEC_FILE" 2>/dev/null || echo true)
          cost=$(jq -r '[.[] | select(.type == "result")] | last | .total_cost_usd // 0' "$EXEC_FILE" 2>/dev/null || echo 0)
          turns=$(jq -r '[.[] | select(.type == "result")] | last | .num_turns // 0' "$EXEC_FILE" 2>/dev/null || echo 0)
          echo "$LABEL result: is_error=$is_error total_cost_usd=$cost num_turns=$turns"
          if [ "$is_error" != "false" ]; then
            echo "::error::$LABEL errored (is_error=$is_error, num_turns=$turns, total_cost_usd=$cost). The run did NOT do its work. Usually an invalid/expired/malformed CLAUDE_CODE_OAUTH_TOKEN (stray whitespace/newline) or a usage limit. Re-mint with 'claude setup-token' and: gh secret set CLAUDE_CODE_OAUTH_TOKEN --body \"\$(pbpaste | tr -d '[:space:]')\""
            exit 1
          fi
