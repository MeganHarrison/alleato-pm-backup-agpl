name: Autofix Issue

# Unified issue-fix lane. Triggered by labels:
#   - `autofix`     → engine chosen by the AUTOFIX_ENGINE repo variable (codex | claude | off)
#   - `codex:fix`   → Codex, unless AUTOFIX_ENGINE=claude (remapped) or off
#   - `claude:fix`  → Claude Code, unless AUTOFIX_ENGINE=off
#
# Every fix lands via a PR — never a direct push to main. The branch ruleset's
# required checks make bot pushes to main impossible (see #620), so the Eve
# triage route + diff-risk gate now pick between two PR lanes:
#   low-risk → PR with auto-merge enabled at creation (merges when checks pass)
#   risky    → PR gated on the Autofix PR Manager's review approval

on:
  issues:
    types: [labeled]

concurrency:
  group: autofix-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  resolve-engine:
    if: contains(fromJSON('["autofix","codex:fix","claude:fix"]'), github.event.label.name)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    outputs:
      engine: ${{ steps.pick.outputs.engine }}
    steps:
      - name: Pick engine from label + AUTOFIX_ENGINE variable
        id: pick
        uses: actions/github-script@v7
        env:
          AUTOFIX_ENGINE: ${{ vars.AUTOFIX_ENGINE }}
          TRIGGER_LABEL: ${{ github.event.label.name }}
        with:
          script: |
            const toggle = (process.env.AUTOFIX_ENGINE || "codex").toLowerCase();
            const label = process.env.TRIGGER_LABEL;

            let engine = "none";
            let note = "";

            if (toggle === "off") {
              engine = "none";
              note = "Autofix is disabled (`AUTOFIX_ENGINE=off`). Set the repository variable `AUTOFIX_ENGINE` to `codex` or `claude` to re-enable, then re-apply the label.";
            } else if (label === "autofix") {
              engine = toggle === "claude" ? "claude" : "codex";
            } else if (label === "codex:fix") {
              engine = toggle === "claude" ? "claude" : "codex";
              if (engine === "claude") {
                note = "`codex:fix` was remapped to the Claude engine because the repository variable `AUTOFIX_ENGINE` is set to `claude`.";
              }
            } else if (label === "claude:fix") {
              engine = "claude";
            }

            if (note) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: note,
              });
            }

            core.setOutput("engine", engine);

  fix:
    needs: resolve-engine
    if: needs.resolve-engine.outputs.engine == 'codex' || needs.resolve-engine.outputs.engine == 'claude'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    env:
      AUTOFIX_ENGINE_CHOICE: ${{ needs.resolve-engine.outputs.engine }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTOFIX_GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # No pnpm cache here: blocked/no-op runs skip `pnpm install`, so the
          # post-job cache-save step fails with "Path(s) ... do not exist" and
          # reddens otherwise-successful runs. Frozen installs are fast enough.

      - name: Prepare issue context
        id: prepare
        uses: actions/github-script@v7
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          ENGINE: ${{ needs.resolve-engine.outputs.engine }}
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const engine = process.env.ENGINE;
            const cleanBody = (issue.body || "").replace(/<!--[\s\S]*?-->/g, "").trim();
            const issueLabels = Array.isArray(issue.labels)
              ? issue.labels.map((label) => typeof label === "string" ? label : label.name).filter(Boolean)
              : [];

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issue.number,
              per_page: 100,
            });

            function section(title) {
              const escaped = title.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const regex = new RegExp(`### ${escaped}\\s*([\\s\\S]*?)(?=\\n### |$)`, "i");
              const match = cleanBody.match(regex);
              return match ? match[1].trim() : "";
            }

            function issueSection(title) {
              const escaped = title.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const regex = new RegExp(`## ${escaped}\\s*([\\s\\S]*?)(?=\\n## |$)`, "i");
              const match = cleanBody.match(regex);
              return match ? match[1].trim() : "";
            }

            function normalizeSlug(value) {
              return value
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, "-")
                .replace(/^-+|-+$/g, "")
                .slice(0, 48);
            }

            function parseBulletValue(sectionBody, label) {
              const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const regex = new RegExp(`^- ${escaped}:\\s*(.+)$`, "mi");
              const match = sectionBody.match(regex);
              return match ? match[1].trim() : "";
            }

            function extractJsonPayload(body) {
              const match = body.match(/## Agent Payload[\s\S]*?```json\s*([\s\S]*?)```/i);
              if (!match) return null;

              try {
                return JSON.parse(match[1]);
              } catch {
                return null;
              }
            }

            function parseEveRoute(commentBody) {
              const match = commentBody.match(/^Path:\s*(.+)$/mi);
              return match ? match[1].trim() : "";
            }

            const automationScope = section("Automation scope");
            const problem = section("Problem statement");
            const expected = section("Expected behavior");
            const repro = section("Reproduction");
            const acceptance = section("Acceptance criteria");
            const allowedPaths = section("Allowed edit paths");
            const guardrail = section("Required guardrail");
            const feedback = issueSection("Feedback");
            const location = issueSection("Location");
            const request = issueSection("Request");
            const screenshot = issueSection("Screenshot");
            const agentPayload = extractJsonPayload(cleanBody);
            const latestEveComment = [...comments]
              .reverse()
              .find((comment) => typeof comment.body === "string" && comment.body.includes("## Eve GitHub Triage"));
            const eveRoute = latestEveComment && typeof latestEveComment.body === "string"
              ? parseEveRoute(latestEveComment.body)
              : "";
            const isAdminFeedbackIssue = issueLabels.includes("admin-feedback");
            const usesIssueTemplate = Boolean(
              automationScope || problem || expected || repro || acceptance || allowedPaths || guardrail,
            );
            const deliveryMode = eveRoute === "direct-to-main" ? "main" : "pull-request";

            const missing = [];
            if (usesIssueTemplate) {
              for (const [label, value] of Object.entries({
                "Automation scope": automationScope,
                "Problem statement": problem,
                "Expected behavior": expected,
                "Reproduction": repro,
                "Acceptance criteria": acceptance,
                "Allowed edit paths": allowedPaths,
                "Required guardrail": guardrail,
              })) {
                if (!value) missing.push(label);
              }
            }

            const blockedReasons = [];
            const notes = [];
            let allowedPathLines = [];
            let issueContext = "";

            if (isAdminFeedbackIssue) {
              const locationUrl = parseBulletValue(location, "URL") || agentPayload?.pageUrl || "";
              const locationPath = parseBulletValue(location, "Path") || agentPayload?.pagePath || "";

              if (!eveRoute) {
                notes.push("No Eve triage comment found — defaulting to the safe pull-request delivery path.");
              } else if (!["direct-to-main", "pr-required"].includes(eveRoute)) {
                blockedReasons.push(`Latest Eve route \`${eveRoute}\` is not executable by automation (needs clarification or is blocked).`);
              }

              if (!feedback) {
                blockedReasons.push("Admin-feedback issue is missing the `## Feedback` section.");
              }

              if (!locationPath && !locationUrl) {
                blockedReasons.push("Admin-feedback issue is missing route/location context.");
              }

              allowedPathLines = ["frontend/src/**", "frontend/tests/**"];
              issueContext = [
                "# GitHub Issue Context",
                "",
                `Issue Number: #${issue.number}`,
                `Issue Title: ${issue.title}`,
                `Issue URL: ${issue.html_url}`,
                `Delivery Mode: ${deliveryMode}`,
                `Eve Route: ${eveRoute || "missing (defaulted to pull-request)"}`,
                `Labels: ${issueLabels.join(", ") || "(none)"}`,
                "Allowed Edit Paths:",
                ...allowedPathLines.map((line) => `- ${line}`),
                "",
                "## Problem statement",
                feedback || "_missing_",
                "",
                "## Expected behavior",
                "Match the reported expected user behavior on the named surface without expanding scope beyond the issue-owned fix.",
                "",
                "## Reproduction",
                locationUrl || locationPath
                  ? `Open ${locationUrl || locationPath} and reproduce the reported problem on the named frontend surface.`
                  : "_missing_",
                "",
                "## Acceptance criteria",
                [
                  `- Fix only the frontend behavior described in issue #${issue.number}.`,
                  "- Keep changes under frontend/src/** or frontend/tests/**.",
                  "- Add at least one guardrail so the bug fails loudly or is covered by validation.",
                  deliveryMode === "main"
                    ? "- This lands as a PR with auto-merge enabled, so validation must fully pass and the change must stay isolated."
                    : "- This lands as a PR gated on automated review because the route was classified as higher risk.",
                ].join("\n"),
                "",
                "## Required guardrail",
                "Add a targeted regression guardrail for the exact reported frontend failure when practical.",
                "",
                "## Location context",
                location || "_missing_",
                "",
                "## Request context",
                request || "_missing_",
                "",
                "## Screenshot context",
                screenshot || "_none_",
                "",
                "## Agent payload",
                "```json",
                JSON.stringify(agentPayload ?? {}, null, 2),
                "```",
                "",
                "## Fixed validation commands",
                "- pnpm --dir frontend install --frozen-lockfile",
                "- pnpm --dir frontend run quality",
                "- pnpm run check:routes",
                "",
              ].join("\n");
            } else {
              if (missing.length > 0) {
                blockedReasons.push(`Issue template is incomplete. Missing sections: ${missing.join(", ")}.`);
              }

              if (automationScope.toLowerCase() !== "frontend") {
                blockedReasons.push("This workflow only supports `Frontend` automation scope in its first version.");
              }

              allowedPathLines = allowedPaths
                .split("\n")
                .map((line) => line.trim())
                .filter(Boolean);

              const invalidAllowedPaths = allowedPathLines.filter((line) => !/^frontend\/(src|tests)\//.test(line));
              if (invalidAllowedPaths.length > 0) {
                blockedReasons.push(
                  `Allowed edit paths must stay under \`frontend/src/\` or \`frontend/tests/\`. Invalid paths: ${invalidAllowedPaths.join(", ")}.`,
                );
              }

              issueContext = [
                "# GitHub Issue Context",
                "",
                `Issue Number: #${issue.number}`,
                `Issue Title: ${issue.title}`,
                `Issue URL: ${issue.html_url}`,
                "Automation Scope: frontend",
                "Allowed Edit Paths:",
                ...allowedPathLines.map((line) => `- ${line}`),
                "",
                "## Problem statement",
                problem || "_missing_",
                "",
                "## Expected behavior",
                expected || "_missing_",
                "",
                "## Reproduction",
                repro || "_missing_",
                "",
                "## Acceptance criteria",
                acceptance || "_missing_",
                "",
                "## Required guardrail",
                guardrail || "_missing_",
                "",
                "## Fixed validation commands",
                "- pnpm --dir frontend install --frozen-lockfile",
                "- pnpm --dir frontend run quality",
                "- pnpm run check:routes",
                "",
              ].join("\n");
            }

            const normalizedTitle = (issue.title || `issue-${issue.number}`)
              .replace(/^\[(codex fix|autofix)\]:\s*/i, "")
              .trim();
            const issueSlug = normalizeSlug(normalizedTitle || `issue-${issue.number}`);
            const branchName = `autofix/issue-${issue.number}-${issueSlug || "fix"}`;

            const promptPath = path.join(process.env.RUNNER_TEMP, "autofix-issue-context.md");
            fs.writeFileSync(promptPath, issueContext);

            const blockerComment = blockedReasons.length
              ? [
                  `Autofix (${engine}) did not start because the issue is not safely automatable yet.`,
                  "",
                  "Cause:",
                  blockedReasons.map((reason) => `- ${reason}`).join("\n"),
                "",
                "Detection gap:",
                "- The issue payload did not provide a fully constrained frontend-only task that this workflow can validate safely.",
                "",
                "Prevention step:",
                isAdminFeedbackIssue
                  ? "- Keep the `admin-feedback` issue labeled and preserve route/location context. If Eve triage marked this as needing clarification, answer the questions on the issue and re-apply the label."
                  : "- Use the `Autofix Frontend Bug` issue form and keep edits limited to `frontend/src/**` and `frontend/tests/**`.",
              ].join("\n")
              : "";

            core.setOutput("blocked", blockedReasons.length > 0 ? "true" : "false");
            core.setOutput("blocker_comment", blockerComment);
            core.setOutput("branch_name", branchName);
            core.setOutput("delivery_mode", deliveryMode);
            core.setOutput("issue_title", normalizedTitle);
            core.setOutput("issue_context_path", promptPath);
            if (notes.length) core.info(notes.join("\n"));

      - name: Build agent prompt
        if: steps.prepare.outputs.blocked != 'true'
        id: build_prompt
        env:
          ISSUE_CONTEXT_PATH: ${{ steps.prepare.outputs.issue_context_path }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          cp .github/automation/prompts/fix-issue.md "$RUNNER_TEMP/autofix-prompt.md"
          printf '\n\n' >> "$RUNNER_TEMP/autofix-prompt.md"
          cat "$ISSUE_CONTEXT_PATH" >> "$RUNNER_TEMP/autofix-prompt.md"

          {
            echo "prompt<<AUTOFIX_PROMPT_EOF"
            cat "$RUNNER_TEMP/autofix-prompt.md"
            echo "AUTOFIX_PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Start artifact directory
        if: steps.prepare.outputs.blocked != 'true'
        run: mkdir -p .github/autofix-artifacts

      - name: Run Codex
        if: steps.prepare.outputs.blocked != 'true' && env.AUTOFIX_ENGINE_CHOICE == 'codex'
        id: run_codex
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ runner.temp }}/autofix-prompt.md
          output-file: .github/autofix-artifacts/final-message.md
          model: gpt-5.4
          effort: high
          sandbox: workspace-write
          safety-strategy: drop-sudo
          codex-args: '["--full-auto"]'

      - name: Run Claude Code
        if: steps.prepare.outputs.blocked != 'true' && env.AUTOFIX_ENGINE_CHOICE == 'claude'
        id: run_claude
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.build_prompt.outputs.prompt }}
          claude_args: |
            --allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(pnpm:*),Bash(npm run:*),Bash(node:*),Bash(npx:*),Bash(ls:*),Bash(cat:*),Bash(grep:*),Bash(rg:*),Bash(mkdir:*),Bash(git diff:*),Bash(git log:*),Bash(git status:*)"

      # claude-code-action can exit 0 even when the underlying Claude Code run
      # errored (e.g. rate limits kill it seconds in with is_error=true) — issue
      # #569 sat in limbo because such a run read as "success, no changes".
      # The action exposes no conclusion output; the truth is the final result
      # entry (is_error) inside its execution_file JSON.
      - name: Evaluate Claude run
        if: steps.prepare.outputs.blocked != 'true' && env.AUTOFIX_ENGINE_CHOICE == 'claude'
        id: claude_result
        shell: bash
        env:
          STEP_OUTCOME: ${{ steps.run_claude.outcome }}
          EXEC_FILE: ${{ steps.run_claude.outputs.execution_file }}
        run: |
          ok=false
          if [ "$STEP_OUTCOME" = "success" ] && [ -n "$EXEC_FILE" ] && [ -f "$EXEC_FILE" ]; then
            is_error=$(jq -r '[.[] | select(.type == "result")] | last | .is_error | if . == null then true else . end' "$EXEC_FILE" 2>/dev/null || echo "true")
            [ "$is_error" = "false" ] && ok=true
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "First Claude attempt ok=$ok"

      - name: Wait before Claude retry
        if: steps.prepare.outputs.blocked != 'true' && env.AUTOFIX_ENGINE_CHOICE == 'claude' && steps.claude_result.outputs.ok != 'true'
        run: sleep 90

      - name: Run Claude Code (retry)
        if: steps.prepare.outputs.blocked != 'true' && env.AUTOFIX_ENGINE_CHOICE == 'claude' && steps.claude_result.outputs.ok != 'true'
        id: run_claude_retry
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.build_prompt.outputs.prompt }}
          claude_args: |
            --allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(pnpm:*),Bash(npm run:*),Bash(node:*),Bash(npx:*),Bash(ls:*),Bash(cat:*),Bash(grep:*),Bash(rg:*),Bash(mkdir:*),Bash(git diff:*),Bash(git log:*),Bash(git status:*)"

      - name: Evaluate Claude retry
        if: steps.prepare.outputs.blocked != 'true' && env.AUTOFIX_ENGINE_CHOICE == 'claude' && steps.claude_result.outputs.ok != 'true'
        id: claude_retry_result
        shell: bash
        env:
          STEP_OUTCOME: ${{ steps.run_claude_retry.outcome }}
          EXEC_FILE: ${{ steps.run_claude_retry.outputs.execution_file }}
        run: |
          ok=false
          if [ "$STEP_OUTCOME" = "success" ] && [ -n "$EXEC_FILE" ] && [ -f "$EXEC_FILE" ]; then
            is_error=$(jq -r '[.[] | select(.type == "result")] | last | .is_error | if . == null then true else . end' "$EXEC_FILE" 2>/dev/null || echo "true")
            [ "$is_error" = "false" ] && ok=true
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "Claude retry ok=$ok"

      - name: Determine agent outcome
        if: steps.prepare.outputs.blocked != 'true'
        id: agent
        env:
          CODEX_OUTCOME: ${{ steps.run_codex.outcome }}
          CLAUDE_OK: ${{ steps.claude_result.outputs.ok }}
          CLAUDE_RETRY_OK: ${{ steps.claude_retry_result.outputs.ok }}
          CLAUDE_EXEC_FILE: ${{ steps.run_claude.outputs.execution_file }}
          CLAUDE_RETRY_EXEC_FILE: ${{ steps.run_claude_retry.outputs.execution_file }}
        run: |
          outcome=failure
          if [ "$CODEX_OUTCOME" = "success" ] || [ "$CLAUDE_OK" = "true" ] || [ "$CLAUDE_RETRY_OK" = "true" ]; then
            outcome=success
          fi

          # Surface Claude's final result text (error messages included) so
          # failure comments explain WHY instead of a generic "did not complete".
          for exec_file in "$CLAUDE_RETRY_EXEC_FILE" "$CLAUDE_EXEC_FILE"; do
            if [ -n "$exec_file" ] && [ -f "$exec_file" ] && [ ! -f .github/autofix-artifacts/final-message.md ]; then
              jq -r '[.[] | select(.type == "result")] | last | .result // "Claude run ended without a result message."' \
                "$exec_file" > .github/autofix-artifacts/final-message.md 2>/dev/null || true
              break
            fi
          done

          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"

      - name: Check changed files
        if: steps.prepare.outputs.blocked != 'true' && steps.agent.outputs.outcome == 'success'
        id: diff
        shell: bash
        run: |
          mapfile -t all_changed < <(git diff --name-only --diff-filter=ACMR)
          mapfile -t untracked < <(git ls-files --others --exclude-standard)
          changed=()

          for file in "${all_changed[@]}" "${untracked[@]}"; do
            if [[ -z "$file" || "$file" == .github/autofix-artifacts/* ]]; then
              continue
            fi
            changed+=("$file")
          done

          if [ "${#changed[@]}" -eq 0 ]; then
            echo "no_changes=true" >> "$GITHUB_OUTPUT"
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          invalid=()
          for file in "${changed[@]}"; do
            if [[ ! "$file" =~ ^frontend/src/ && ! "$file" =~ ^frontend/tests/ ]]; then
              invalid+=("$file")
            fi
          done

          if [ "${#invalid[@]}" -gt 0 ]; then
            {
              echo "allowed=false"
              echo "invalid_files<<EOF"
              printf '%s\n' "${invalid[@]}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "no_changes=false"
            echo "allowed=true"
          } >> "$GITHUB_OUTPUT"

      - name: Decide delivery mode from diff risk
        if: steps.prepare.outputs.blocked != 'true' && steps.agent.outputs.outcome == 'success' && steps.diff.outputs.no_changes != 'true' && steps.diff.outputs.allowed == 'true'
        id: route
        shell: bash
        env:
          # Eve triage decides the intended lane from the ISSUE. This step re-checks
          # the decision against the ACTUAL diff the agent produced and can only ever
          # downgrade main -> pull-request when the change looks risky. It never
          # upgrades a PR to a direct push.
          INITIAL_DELIVERY_MODE: ${{ steps.prepare.outputs.delivery_mode }}
        run: |
          mode="$INITIAL_DELIVERY_MODE"
          reason=""

          if [ "$mode" = "main" ]; then
            mapfile -t tracked < <(git diff --name-only --diff-filter=ACMR | grep -v '^.github/autofix-artifacts/' || true)
            mapfile -t untracked < <(git ls-files --others --exclude-standard | grep -v '^.github/autofix-artifacts/' || true)
            changed=()
            for file in "${tracked[@]}" "${untracked[@]}"; do
              [ -n "$file" ] && changed+=("$file")
            done
            files_count="${#changed[@]}"
            lines_changed="$(git diff --numstat --diff-filter=ACMR \
              | awk '$3 !~ /^\.github\/autofix-artifacts\// && $1 ~ /^[0-9]+$/ {added+=$1; removed+=$2} END {print added+removed+0}')"

            # Surfaces where a silent wrong change on main is expensive: server write
            # paths, auth/RLS, the Supabase layer, and money/contract logic.
            risky_pattern='(^frontend/src/app/api/)|(/route\.(ts|tsx)$)|(^frontend/src/middleware\.ts$)|(^frontend/src/lib/supabase/)|(auth|rls|permission|invoice|payment|billing|budget|contract|commitment|retainage)'
            risky_files=()
            for file in "${changed[@]}"; do
              if printf '%s\n' "$file" | grep -qiE "$risky_pattern"; then
                risky_files+=("$file")
              fi
            done

            if [ "${#risky_files[@]}" -gt 0 ]; then
              mode="pull-request"
              reason="Diff touches higher-risk surfaces, so it needs a reviewed PR instead of a direct push: ${risky_files[*]}"
            elif [ "${files_count:-0}" -gt 6 ]; then
              mode="pull-request"
              reason="Diff spans ${files_count} files (> 6), too broad to publish straight to main."
            elif [ "${lines_changed:-0}" -gt 400 ]; then
              mode="pull-request"
              reason="Diff changes ${lines_changed} lines (> 400), too large to publish straight to main."
            fi
          fi

          # Map the (possibly downgraded) lane onto PR-only delivery:
          #   true  -> low-risk: normal PR with auto-merge enabled (lands when green)
          #   false -> risky/pr-required: PR waits for the Autofix PR Manager's approval
          auto_merge=false
          if [ "$mode" = "main" ]; then
            auto_merge=true
          fi

          echo "auto_merge=$auto_merge" >> "$GITHUB_OUTPUT"
          {
            echo "escalation_reason<<REASON_EOF"
            echo "$reason"
            echo "REASON_EOF"
          } >> "$GITHUB_OUTPUT"

          if [ -n "$reason" ]; then
            echo "Low-risk lane downgraded to a review-gated PR: $reason"
          elif [ "$auto_merge" = "true" ]; then
            echo "Low-risk: opening a PR with auto-merge enabled."
          else
            echo "Higher-risk: opening a PR gated on automated review approval."
          fi

      - name: Install frontend dependencies
        if: steps.prepare.outputs.blocked != 'true' && steps.agent.outputs.outcome == 'success' && steps.diff.outputs.no_changes != 'true' && steps.diff.outputs.allowed == 'true'
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Validate changes
        if: steps.prepare.outputs.blocked != 'true' && steps.agent.outputs.outcome == 'success' && steps.diff.outputs.no_changes != 'true' && steps.diff.outputs.allowed == 'true'
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          # Validate only what the agent changed. The full-program `pnpm quality`
          # typecheck times out (~5 min) on this repo regardless of the diff, so it
          # fails every run before a PR can open. The PR's own required checks
          # (changed-quality, guardrails, design-system-guardrails) are the
          # authoritative gate before auto-merge; this is just a pre-flight to avoid
          # opening an obviously-broken PR.
          {
            echo '$ pnpm --dir frontend run quality:changed'
            pnpm --dir frontend run quality:changed
            echo
            echo '$ pnpm run check:routes'
            pnpm run check:routes
          } 2>&1 | tee .github/autofix-artifacts/validation.log

      - name: Prepare PR body
        if: steps.prepare.outputs.blocked != 'true' && steps.agent.outputs.outcome == 'success' && steps.diff.outputs.no_changes != 'true' && steps.diff.outputs.allowed == 'true' && steps.validate.outcome == 'success'
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ENGINE: ${{ needs.resolve-engine.outputs.engine }}
          ESCALATION_REASON: ${{ steps.route.outputs.escalation_reason }}
          AUTO_MERGE: ${{ steps.route.outputs.auto_merge }}
        shell: bash
        run: |
          {
            echo "# Automated Fix (${ENGINE})"
            echo
            echo "Resolves #$ISSUE_NUMBER"
            echo
            if [ "$AUTO_MERGE" = "true" ]; then
              echo "> Triaged low-risk and the diff-risk gate agreed: **auto-merge is enabled** — this PR merges once the required checks pass."
              echo
            elif [ -n "$ESCALATION_REASON" ]; then
              echo "> Triaged as a low-risk fix, but the diff-risk gate escalated it to a review-gated PR:"
              echo "> $ESCALATION_REASON"
              echo
            fi
            if [ -f .github/autofix-artifacts/SUMMARY.md ]; then
              cat .github/autofix-artifacts/SUMMARY.md
              echo
            fi
            cat .github/automation/templates/pr-body.md
          } > "$RUNNER_TEMP/autofix-pr-body.md"

      - name: Upload artifacts
        if: always() && steps.prepare.outputs.blocked != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: autofix-issue-${{ github.event.issue.number }}-artifacts
          path: .github/autofix-artifacts/
          if-no-files-found: ignore

      - name: Capture no-change explanation
        if: steps.prepare.outputs.blocked != 'true' && steps.diff.outputs.no_changes == 'true'
        id: no_change_reason
        shell: bash
        run: |
          if [ -f .github/autofix-artifacts/BLOCKED.md ]; then
            {
              echo "reason<<EOF"
              cat .github/autofix-artifacts/BLOCKED.md
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          elif [ -f .github/autofix-artifacts/final-message.md ]; then
            {
              echo "reason<<EOF"
              echo "The agent made no changes and wrote no BLOCKED.md — it did not follow the output contract, which usually means the run degraded partway. Its final message:"
              echo
              head -c 3000 .github/autofix-artifacts/final-message.md
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "reason=The agent made no changes and wrote no BLOCKED.md — it did not follow the output contract, which usually means the run errored early (rate limit / API failure). Check the run logs." >> "$GITHUB_OUTPUT"
          fi

      - name: Capture validation log excerpt
        if: always() && steps.prepare.outputs.blocked != 'true'
        id: validation_log
        shell: bash
        run: |
          if [ -f .github/autofix-artifacts/validation.log ]; then
            {
              echo "excerpt<<EOF"
              tail -n 60 .github/autofix-artifacts/validation.log
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "excerpt=Validation log not found." >> "$GITHUB_OUTPUT"
          fi

      - name: Capture agent final message
        if: always() && steps.prepare.outputs.blocked != 'true'
        id: final_message
        shell: bash
        run: |
          if [ -f .github/autofix-artifacts/final-message.md ]; then
            {
              echo "text<<EOF"
              head -c 4000 .github/autofix-artifacts/final-message.md
              echo
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "text=The agent exited before producing a final message." >> "$GITHUB_OUTPUT"
          fi

      - name: Remove runtime artifacts from diff
        if: steps.prepare.outputs.blocked != 'true'
        shell: bash
        run: |
          rm -rf .github/autofix-artifacts
          git clean -fd .github/autofix-artifacts || true

      - name: Create pull request
        if: steps.prepare.outputs.blocked != 'true' && steps.agent.outputs.outcome == 'success' && steps.diff.outputs.no_changes != 'true' && steps.diff.outputs.allowed == 'true' && steps.validate.outcome == 'success'
        id: create_pr
        # Disable Husky: peter-evans commits the change internally, which fires the
        # repo's pre-commit gauntlet (and fails with "git user.email is not set" in
        # CI). The PR's required checks are the real gate, so the local hooks add no
        # safety here — they only block PR creation.
        env:
          HUSKY: "0"
        uses: peter-evans/create-pull-request@v7
        with:
          # Use a dedicated token, NOT the default GITHUB_TOKEN: PRs opened by
          # GITHUB_TOKEN do not trigger `on: pull_request` workflows, so the
          # branch ruleset's required checks would never run and the PR could
          # never merge (or auto-merge). AUTOFIX_GITHUB_TOKEN triggers them.
          token: ${{ secrets.AUTOFIX_GITHUB_TOKEN }}
          branch: ${{ steps.prepare.outputs.branch_name }}
          title: "fix: ${{ steps.prepare.outputs.issue_title }} (#${{ github.event.issue.number }})"
          body-path: ${{ runner.temp }}/autofix-pr-body.md
          commit-message: "fix: ${{ steps.prepare.outputs.issue_title }} (#${{ github.event.issue.number }})"
          author: "MeganHarrison <109628141+MeganHarrison@users.noreply.github.com>"
          committer: "MeganHarrison <109628141+MeganHarrison@users.noreply.github.com>"
          draft: false
          delete-branch: true
          labels: |
            automated-pr
            ${{ needs.resolve-engine.outputs.engine }}

      - name: Enable auto-merge for low-risk fix
        if: steps.prepare.outputs.blocked != 'true' && steps.route.outputs.auto_merge == 'true' && steps.create_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.AUTOFIX_GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pull-request-number }}
        # The ruleset stays the gate: this merges the PR only once every required
        # status check passes. No direct-to-main push is involved.
        run: gh pr merge "$PR_NUMBER" --squash --auto

      - name: Comment with PR link
        if: steps.prepare.outputs.blocked != 'true' && steps.agent.outputs.outcome == 'success' && steps.diff.outputs.no_changes != 'true' && steps.diff.outputs.allowed == 'true' && steps.validate.outcome == 'success'
        uses: actions/github-script@v7
        env:
          PULL_REQUEST_NUMBER: ${{ steps.create_pr.outputs.pull-request-number }}
          PULL_REQUEST_URL: ${{ steps.create_pr.outputs.pull-request-url }}
          ENGINE: ${{ needs.resolve-engine.outputs.engine }}
          AUTO_MERGE: ${{ steps.route.outputs.auto_merge }}
        with:
          script: |
            const prNumber = process.env.PULL_REQUEST_NUMBER;
            const prUrl = process.env.PULL_REQUEST_URL;

            if (!prNumber || !prUrl) {
              core.setFailed("PR metadata was not returned by create-pull-request.");
              return;
            }

            const body = process.env.AUTO_MERGE === "true"
              ? `Autofix (${process.env.ENGINE}) opened PR #${prNumber} with auto-merge enabled — it merges automatically once the required checks pass: ${prUrl}. This issue closes on merge.`
              : `Autofix (${process.env.ENGINE}) opened PR #${prNumber}: ${prUrl}. It will be auto-reviewed and auto-merged once the review approves and checks pass; this issue closes on merge.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Comment with blocker details
        if: |
          always() &&
          (
            steps.prepare.outputs.blocked == 'true' ||
            steps.agent.outputs.outcome == 'failure' ||
            steps.diff.outputs.allowed == 'false' ||
            steps.diff.outputs.no_changes == 'true' ||
            steps.validate.outcome == 'failure'
          )
        uses: actions/github-script@v7
        env:
          BLOCKED: ${{ steps.prepare.outputs.blocked }}
          BLOCKER_COMMENT: ${{ steps.prepare.outputs.blocker_comment }}
          AGENT_OUTCOME: ${{ steps.agent.outputs.outcome }}
          DIFF_ALLOWED: ${{ steps.diff.outputs.allowed }}
          DIFF_INVALID_FILES: ${{ steps.diff.outputs.invalid_files }}
          DIFF_NO_CHANGES: ${{ steps.diff.outputs.no_changes }}
          NO_CHANGE_REASON: ${{ steps.no_change_reason.outputs.reason }}
          VALIDATION_EXCERPT: ${{ steps.validation_log.outputs.excerpt }}
          FINAL_MESSAGE: ${{ steps.final_message.outputs.text }}
          ENGINE: ${{ needs.resolve-engine.outputs.engine }}
          TRIGGER_LABEL: ${{ github.event.label.name }}
        with:
          script: |
            const engine = process.env.ENGINE;
            let body = "";

            if (process.env.BLOCKED === "true") {
              body = process.env.BLOCKER_COMMENT;
            } else if (process.env.AGENT_OUTCOME === "failure") {
              body = [
                `Autofix (${engine}) attempted the fix but did not complete successfully.`,
                "",
                "Cause:",
                `- ${process.env.FINAL_MESSAGE || "The agent exited before producing a final message."}`,
                "",
                "Detection gap:",
                "- The workflow has no stronger preflight signal for this failure mode than the agent run itself.",
                "",
                "Prevention step:",
                "- Tighten the issue scope further or split the issue into a smaller frontend-only fix with explicit acceptance criteria.",
              ].join("\n");
            } else if (process.env.DIFF_ALLOWED === "false") {
              body = [
                `Autofix (${engine}) changes were rejected before publish.`,
                "",
                "Cause:",
                "- The agent edited files outside the allowed frontend scope.",
                process.env.DIFF_INVALID_FILES ? `- Invalid files:\n${process.env.DIFF_INVALID_FILES}` : "",
                "",
                "Detection gap:",
                "- The issue scope was not narrow enough to keep the agent inside the approved file boundaries.",
                "",
                "Prevention step:",
                "- Narrow the allowed paths in the issue and reserve this automation for focused frontend bugs.",
              ].filter(Boolean).join("\n");
            } else if (process.env.DIFF_NO_CHANGES === "true") {
              body = [
                `Autofix (${engine}) did not publish because no code changes were produced.`,
                "",
                process.env.NO_CHANGE_REASON || "The agent finished without making changes.",
              ].join("\n");
            } else {
              body = [
                `Autofix (${engine}) produced a candidate fix, but validation failed so no PR was created.`,
                "",
                "Cause:",
                "- Repo validation failed after agent edits.",
                "",
                "Detection gap:",
                "- The workflow could not prove the issue was fixed without violating repo quality gates.",
                "",
                "Prevention step:",
                "- Add or tighten issue acceptance criteria so the fix path stays aligned with existing frontend checks.",
                "",
                "Validation excerpt:",
                "```text",
                process.env.VALIDATION_EXCERPT || "Validation log not found.",
                "```",
              ].join("\n");
            }

            // Terminal failures must never strand the issue in silent limbo
            // (issue #569): escalate visibly and reset the trigger so a clean
            // re-run is one label away.
            const triggerLabel = process.env.TRIGGER_LABEL;
            body += [
              "",
              "",
              "---",
              `This issue is now labeled \`autofix:needs-human\`. To retry automation after addressing the cause: remove \`autofix:needs-human\`, then re-apply the \`${triggerLabel}\` label.`,
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ["autofix:needs-human"],
            });

            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: triggerLabel,
              });
            } catch (error) {
              core.info(`Trigger label ${triggerLabel} was already removed: ${error.message}`);
            }
