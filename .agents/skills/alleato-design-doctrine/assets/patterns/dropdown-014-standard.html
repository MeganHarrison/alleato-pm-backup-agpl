<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dropdown Pattern 014 - Standard Header Dropdown</title>
    <style>
      :root {
        color-scheme: light;
        --background: #ffffff;
        --foreground: #1f2933;
        --muted: #6b7280;
        --border: #e5e7eb;
        --hover: #f3f4f6;
        --shadow: 0 4px 12px rgba(15, 23, 42, 0.12);
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8fafc;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      .menu {
        width: 224px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--background);
        color: var(--foreground);
        box-shadow: var(--shadow);
        padding: 6px;
      }

      .label {
        padding: 6px 8px;
        font-size: 13px;
        line-height: 18px;
        font-weight: 600;
      }

      .separator {
        height: 1px;
        margin: 4px 0;
        background: var(--border);
      }

      .item {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 34px;
        padding: 6px 8px;
        border-radius: 6px;
        font-size: 14px;
        line-height: 20px;
      }

      .item:hover {
        background: var(--hover);
      }

      .icon {
        width: 16px;
        height: 16px;
        flex: none;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="menu" role="menu" aria-label="Comments">
      <div class="label">Comments</div>
      <div class="separator"></div>
      <div class="item" role="menuitem">
        <span class="icon">+</span>
        <span>Add comment</span>
      </div>
      <div class="item" role="menuitem">
        <span class="icon">▣</span>
        <span>Open discussion</span>
      </div>
      <div class="separator"></div>
      <div class="item" role="menuitem">
        <span class="icon">✓</span>
        <span>Hide comments</span>
      </div>
    </div>
  </body>
</html>
